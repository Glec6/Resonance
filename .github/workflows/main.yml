name: Build Resonance PS4

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:
    inputs:
      resonance_version:
        description: "Resonance version (e.g. 01.00)"
        required: true
        default: "01.00"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENORBIS: /opt/pacbrew/ps4/openorbis
      RESONANCE_VERSION: ${{ github.event.inputs.resonance_version || '01.00' }}
      PSB: /home/runner/resonance-build
      CRM: /home/runner/dolphinps4-build
    steps:
      - name: Check out Resonance
        uses: actions/checkout@v4
        with:
          path: Resonance

      - name: Check out DolphinPS4 (Mesa/RADV scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/DolphinPS4
          path: DolphinPS4

      - name: Make repo scripts executable
        run: |
          for r in Resonance DolphinPS4; do
            cd $GITHUB_WORKSPACE/$r
            find toolchain scripts -type f -exec chmod +x {} + 2>/dev/null || true
          done

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "RESONANCE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip xz-utils \
            pacman-package-manager makepkg libarchive-tools autoconf libtool \
            nasm curl ninja-build glslang-tools python3-pip python3-venv \
            python3-pil wget lsb-release software-properties-common gnupg \
            bison flex pkg-config

      - name: Install Mesa Python tools and Meson globally
        run: |
          mkdir -p $PSB /home/runner/dolphinps4-build
          sudo pip3 install meson --break-system-packages
          python3 -m venv $PSB/mesa-venv
          $PSB/mesa-venv/bin/pip install mako pyyaml packaging setuptools
          echo "$PSB/mesa-venv/bin" >> $GITHUB_PATH

      - name: Install clang 21 and LLVM tools
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt -yq install clang-21 lld-21 llvm-21
          for t in llvm-ar llvm-ranlib llvm-nm llvm-objcopy llvm-strip ld.lld; do
            if [ -x /usr/bin/$t-21 ] && ! command -v $t >/dev/null; then
              sudo ln -s /usr/bin/$t-21 /usr/local/bin/$t
            fi
          done

      - name: Install ps4 toolchain (OpenOrbis from PacBrew)
        run: |
          sudo tee -a /etc/pacman.conf > /dev/null <<EOF
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          EOF
          sudo pacman -Syu
          sudo pacman --noconfirm -S ps4-openorbis ps4-openorbis-portlibs

      - name: Prepare Resonance build tree and ~/resonance link
        run: |
          mkdir -p $PSB/src $PSB/build $PSB/out $PSB/logs $PSB/oelf
          ln -sfn $GITHUB_WORKSPACE/Resonance $HOME/resonance

      # ---------- Stage 1: Native Build for Sysroot + Mesa/RADV (Cached) ----------
      - name: Cache sysroot and Mesa build
        id: base_cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/resonance-build/sysroot
            /home/runner/dolphinps4-build/build/mesa
            /home/runner/resonance-build/build/libcxx
          key: resonance-native-base-v2-${{ runner.os }}-${{ hashFiles('Resonance/toolchain/**', 'DolphinPS4/scripts/build-mesa.sh', 'DolphinPS4/patches/mesa-ps4.patch') }}

      - name: Build sysroot (libc++ 21 and runtime)
        if: steps.base_cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/Resonance
          bash toolchain/build-libcxx.sh
          bash toolchain/build-runtime.sh

      - name: Build Mesa/RADV static libraries natively
        if: steps.base_cache.outputs.cache-hit != 'true'
        run: |
          MS=$GITHUB_WORKSPACE/DolphinPS4
          MP=$MS/patches/mesa-ps4.patch
          
          mkdir -p /home/runner/dolphinps4-build/src /home/runner/dolphinps4-build/build
          ln -sfn $PSB/sysroot /home/runner/dolphinps4-build/sysroot
          
          git clone --branch libdrm-2.4.125 --depth 1 https://gitlab.freedesktop.org/mesa/drm.git /home/runner/dolphinps4-build/src/libdrm
          git clone --branch mesa-26.0.8 --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git /home/runner/dolphinps4-build/src/mesa
          git -C /home/runner/dolphinps4-build/src/mesa apply $MP

          cd $MS
          bash scripts/build-mesa.sh setup

          LIBS="src/amd/vulkan/libvulkan_radeon.a src/amd/common/libamd_common.a
                src/amd/compiler/libaco.a src/amd/addrlib/libaddrlib.a src/vulkan/util/libvulkan_util.a
                src/compiler/spirv/libvtn.a src/compiler/nir/libnir.a src/compiler/libcompiler.a
                src/util/libxmlconfig.a src/util/libmesa_util.a src/util/libmesa_util_simd.a
                src/util/libmesa_util_clflush.a src/util/libmesa_util_clflushopt.a src/util/libparson.a
                src/util/blake3/libblake3.a src/c11/impl/libmesa_util_c11.a"
          ninja -C /home/runner/dolphinps4-build/build/mesa $LIBS

      # ---------- Stage 2: Resonance & Flycast ----------
      - name: Create stub libraries for optional dependencies
        run: |
          mkdir -p $PSB/sysroot/lib
          for lib in libnfs libsmb2 libcurl libssl libcrypto; do
            llvm-ar rcs $PSB/sysroot/lib/$lib.a
          done
          [ -f $PSB/sysroot/lib/libssl.a ] || { echo "::error::Failed to create libssl stub"; exit 1; }

      - name: Clone Flycast at the pinned base and apply the PS4 patch
        run: |
          cd $HOME/resonance
          BASE=$(awk '/^base:/{print $2}' patches/BASE.txt)
          echo "Flycast base: $BASE"
          git clone https://github.com/flyinghead/flycast.git $PSB/src/flycast
          cd $PSB/src/flycast
          git checkout "$BASE"
          git submodule update --init --recursive
          git checkout -b ps4
          git apply $HOME/resonance/patches/flycast-ps4.patch

      - name: Configure and build Flycast
        run: |
          cd $HOME/resonance
          set +e
          bash scripts/rebuild-flycast.sh
          set -e
          LOGS="$PSB/logs"
          for step in configure build; do
            if [ "$(tail -n1 "$LOGS/$step.log" 2>/dev/null)" != "exit=0" ]; then
              echo "::error::Flycast $step failed"
              grep -E 'error:|FAILED:' "$LOGS/$step.log" | head -40 || true
              tail -30 "$LOGS/$step.log" || true
              exit 1
            fi
          done

      - name: Package
        run: |
          cd $HOME/resonance
          RESONANCE_VERSION=$RESONANCE_VERSION bash scripts/package-resonance.sh

      - name: Collect .pkg
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          cp -v $GITHUB_WORKSPACE/Resonance/out/*.pkg $GITHUB_WORKSPACE/dist/
          ls -la $GITHUB_WORKSPACE/dist

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /home/runner/resonance-build/logs

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.pkg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save PS4 PKG to Summary Page
        uses: actions/upload-artifact@v4
        with:
          name: resonance-ps4-pkg
          path: dist/*.pkg

      - name: Save symbols
        uses: actions/upload-artifact@v4
        with:
          name: resonance-symbols-v${{ env.RESONANCE_VERSION }}
          path: /home/runner/resonance-build/oelf/*
          retention-days: 30
