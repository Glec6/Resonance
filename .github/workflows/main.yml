name: Build Resonance PS4

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:
    inputs:
      resonance_version:
        description: "Resonance version (e.g. 01.00)"
        required: true
        default: "01.00"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENORBIS: /opt/pacbrew/ps4/openorbis
      RESONANCE_VERSION: ${{ github.event.inputs.resonance_version || '01.00' }}
    steps:
      - name: Check out Resonance
        uses: actions/checkout@v4
        with:
          path: Resonance

      - name: Check out DolphinPS4 (source of sysroot + RADV)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/DolphinPS4
          path: DolphinPS4
          # token: ${{ secrets.DOLPHINPS4_PAT }}

      - name: Make repo scripts executable
        run: |
          for r in Resonance DolphinPS4; do
            cd $GITHUB_WORKSPACE/$r
            find toolchain scripts -type f -exec chmod +x {} + 2>/dev/null || true
          done

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "RESONANCE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip \
            pacman-package-manager makepkg libarchive-tools autoconf libtool \
            nasm curl ninja-build glslang-tools python3-pip python3-venv \
            python3-pil wget lsb-release software-properties-common gnupg \
            bison flex pkg-config

      - name: Install Mesa Python tools
        run: |
          python3 -m venv /home/runner/mesa-venv
          /home/runner/mesa-venv/bin/pip install meson mako pyyaml packaging setuptools
          echo "/home/runner/mesa-venv/bin" >> $GITHUB_PATH
          /home/runner/mesa-venv/bin/meson --version

      - name: Install clang 21 and LLVM tools
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt -yq install clang-21 lld-21 llvm-21
          for t in llvm-ar llvm-ranlib llvm-nm llvm-objcopy llvm-strip ld.lld; do
            if [ -x /usr/bin/$t-21 ] && ! command -v $t >/dev/null; then
              sudo ln -s /usr/bin/$t-21 /usr/local/bin/$t
            fi
          done
          clang-21 --version
          ninja --version

      - name: Install ps4 toolchain (OpenOrbis from PacBrew)
        run: |
          sudo tee -a /etc/pacman.conf > /dev/null <<EOF
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          EOF
          sudo pacman -Syu
          sudo pacman --noconfirm -S ps4-openorbis ps4-openorbis-portlibs

      # ---------- Stage 1: source tree for seed-build-tree.sh (CRM) ----------
      - name: Cache source tree (sysroot + built Mesa)
        id: crm_cache
        uses: actions/cache@v4
        with:
          path: /home/runner/dolphinps4-build
          key: crm-tree-${{ runner.os }}-${{ hashFiles('DolphinPS4/toolchain/**', 'DolphinPS4/port/**', 'DolphinPS4/patches/mesa-ps4.patch', 'DolphinPS4/scripts/build-mesa.sh') }}

      - name: Build sysroot (libc++ and runtime)
        if: steps.crm_cache.outputs.cache-hit != 'true'
        env:
          PSB: /home/runner/dolphinps4-build
        run: |
          cd $GITHUB_WORKSPACE/DolphinPS4
          bash toolchain/build-libcxx.sh
          bash toolchain/build-runtime.sh

      - name: Build Mesa/RADV
        if: steps.crm_cache.outputs.cache-hit != 'true'
        env:
          PSB: /home/runner/dolphinps4-build
        run: |
          mkdir -p $PSB/src
          git clone --branch libdrm-2.4.125 --depth 1 https://gitlab.freedesktop.org/mesa/drm.git $PSB/src/libdrm
          git clone --branch mesa-26.0.8 --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git $PSB/src/mesa
          cd $PSB/src/mesa
          git apply $GITHUB_WORKSPACE/DolphinPS4/patches/mesa-ps4.patch
          cd $GITHUB_WORKSPACE/DolphinPS4
          bash scripts/build-mesa.sh setup
          ninja -C $PSB/build/mesa
          echo "static libs built: $(find $PSB/build/mesa -name '*.a' | wc -l)"

      # ---------- Stage 2: Resonance ----------
      - name: Clone and patch Flycast
        run: |
          cd $GITHUB_WORKSPACE/Resonance
          bash scripts/clone-flycast.sh
          git -C $HOME/resonance-build/src/flycast checkout -b ps4
          git -C $HOME/resonance-build/src/flycast apply $GITHUB_WORKSPACE/Resonance/patches/flycast-ps4.patch

      - name: Seed Resonance build tree
        env:
          CRM: /home/runner/dolphinps4-build
        run: |
          if [ ! -d "$CRM/host-compat" ]; then
            echo "::warning::$CRM/host-compat missing, creating empty dir"
            mkdir -p "$CRM/host-compat"
          fi
          cd $GITHUB_WORKSPACE/Resonance
          bash scripts/seed-build-tree.sh

      - name: Configure and build Flycast
        run: |
          cd $GITHUB_WORKSPACE/Resonance
          # rebuild-flycast.sh's exit code is unreliable; logrun.sh appends "exit=<rc>" to each log.
          set +e
          bash scripts/rebuild-flycast.sh
          set -e
          LOGS="$HOME/resonance-build/logs"
          for step in configure build; do
            if [ "$(tail -n1 "$LOGS/$step.log" 2>/dev/null)" != "exit=0" ]; then
              echo "::error::Flycast $step failed"
              grep -E 'error:|FAILED:' "$LOGS/$step.log" | head -40 || true
              tail -30 "$LOGS/$step.log" || true
              exit 1
            fi
          done
          echo "Flycast build OK"

      - name: Package
        run: |
          cd $GITHUB_WORKSPACE/Resonance
          RESONANCE_VERSION=$RESONANCE_VERSION bash scripts/package-resonance.sh

      - name: Collect release files
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          cp -v $GITHUB_WORKSPACE/Resonance/out/*.pkg $GITHUB_WORKSPACE/dist/
          cp -v $GITHUB_WORKSPACE/Resonance/out/*-update.tar $GITHUB_WORKSPACE/dist/
          ls -la $GITHUB_WORKSPACE/dist

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /home/runner/resonance-build/logs

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save PS4 PKG to Summary Page
        uses: actions/upload-artifact@v4
        with:
          name: resonance-ps4-pkg
          path: dist/*

      - name: Save symbols
        uses: actions/upload-artifact@v4
        with:
          name: resonance-symbols-v${{ env.RESONANCE_VERSION }}
          path: /home/runner/resonance-build/oelf/*
          retention-days: 30
